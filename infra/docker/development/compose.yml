name: libresuite-development

services:
  kafka:
    container_name: kafka
    image: apache/kafka:latest
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  web:
    container_name: web
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile.development
      target: development
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../../../apps/web/src:/app/apps/web/src
      - ../../../apps/web/public:/app/apps/web/public
      - ../../../apps/web/next.config.ts:/app/apps/web/next.config.ts
      - ../../../apps/web/postcss.config.mjs:/app/apps/web/postcss.config.mjs
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

  gateway:
    container_name: gateway
    build:
      context: ../../..
      dockerfile: apps/gateway/Dockerfile.development
      target: development
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    volumes:
      - ../../../apps/gateway/src:/app/apps/gateway/src
    env_file:
      - ../../../apps/gateway/.env.development
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

  users-db:
    container_name: users-db
    image: postgres:17-alpine
    ports:
      - "${USERS_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  users:
    container_name: users
    build:
      context: ../../..
      dockerfile: services/users/Dockerfile.development
      target: development
    ports:
      - "${USERS_PORT:-4001}:4001"
    volumes:
      - ../../../services/users/src:/app/services/users/src
    env_file:
      - ../../../services/users/.env.development
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      DATABASE_URL: postgresql://postgres:postgres@users-db:5432/users
    depends_on:
      kafka:
        condition: service_healthy
      users-db:
        condition: service_healthy
    restart: unless-stopped

  secrets:
    container_name: secrets
    build:
      context: ../../..
      dockerfile: services/secrets/Dockerfile.development
      target: development
    ports:
      - "${SECRETS_PORT:-4004}:4004"
    volumes:
      - ../../../services/secrets/src:/app/services/secrets/src
    env_file:
      - ../../../services/secrets/.env.development
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  users-db-data:
